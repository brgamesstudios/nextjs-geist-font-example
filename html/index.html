<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="container hidden">
    <header class="header">
      <div class="brand">
        <div class="logo">🔧</div>
        <div class="title">Mechanic</div>
      </div>
      <button id="btn-close" class="btn btn-ghost">×</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="diagnostics">Diagnostics</button>
      <button class="tab" data-tab="repair">Repair</button>
      <button class="tab" data-tab="parts">Parts</button>
    </nav>

    <section id="tab-diagnostics" class="tab-content active">
      <div class="card">
        <div class="row between">
          <div>
            <div class="muted">Vehicle</div>
            <div id="veh-model" class="value">-</div>
          </div>
          <div>
            <div class="muted">Plate</div>
            <div id="veh-plate" class="value">-</div>
          </div>
        </div>
        <div class="row">
          <div class="muted">Health</div>
          <div class="progress">
            <div id="veh-health-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <div id="veh-health-label" class="value">0%</div>
        </div>
        <div class="row right">
          <button id="btn-refresh" class="btn">Refresh</button>
        </div>
      </div>
    </section>

    <section id="tab-repair" class="tab-content">
      <div class="card">
        <div class="list" id="repair-list">
          <!-- Repairs populated by JS -->
        </div>
      </div>
    </section>

    <section id="tab-parts" class="tab-content">
      <div class="card">
        <div class="list" id="parts-list">
          <!-- Inventory populated by JS -->
        </div>
        <div class="spacer"></div>
        <div class="list" id="shop-list">
          <!-- Shop populated by JS -->
        </div>
      </div>
    </section>
  </div>

  <div id="progress" class="progress-overlay hidden">
    <div class="progress-modal">
      <div id="progress-label" class="muted">Working...</div>
      <div class="progress large">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
