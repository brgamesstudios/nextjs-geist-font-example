<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="container hidden">
    <header class="header">
      <div class="brand">
        <img src="assets/logo.png" alt="Logo" onerror="this.style.display='none'" />
        <h1>Mechanic</h1>
      </div>
      <button id="closeBtn" class="close">×</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="diagnostics">Diagnostics</button>
      <button class="tab" data-tab="repair">Repair</button>
      <button class="tab" data-tab="parts">Parts</button>
    </nav>

    <section class="content">
      <div id="tab-diagnostics" class="tab-pane active">
        <div class="card">
          <h2>Vehicle</h2>
          <div class="info-grid">
            <div><span>Model:</span> <strong id="vehModel">-</strong></div>
            <div><span>Plate:</span> <strong id="vehPlate">-</strong></div>
            <div><span>Class:</span> <strong id="vehClass">-</strong></div>
          </div>
          <div class="meter">
            <div class="meter-bar" id="vehHealthBar" style="width: 0%"></div>
          </div>
          <div class="meter-label">Health: <span id="vehHealth">0%</span></div>
        </div>
      </div>

      <div id="tab-repair" class="tab-pane">
        <div class="card">
          <h2>Repair Options</h2>
          <div id="repairOptions" class="list"></div>
        </div>
      </div>

      <div id="tab-parts" class="tab-pane">
        <div class="card">
          <h2>Parts Inventory</h2>
          <div id="partsInventory" class="list"></div>
        </div>
        <div class="card">
          <h2>Parts Shop</h2>
          <div id="partsShop" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="progress" class="progress hidden">
    <div class="progress-inner">
      <div id="progressLabel">Working...</div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
