<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root" class="hud hidden">
    <div class="top-left">
      <div class="row">
        <div class="chip" id="playerIdChip">ID <span id="playerId">0</span></div>
        <div class="chip" id="cashChip">$<span id="cash">0</span></div>
        <div class="chip" id="bankChip">BANK $<span id="bank">0</span></div>
        <div class="clock" id="clock">12:00</div>
      </div>
    </div>

    <div class="top">
      <div id="compass">N</div>
      <div id="street">Popular St • La Mesa</div>
      <div id="voice" class="voice">
        <div class="dot"></div>
        <span id="voiceLevel">N</span>
      </div>
    </div>

    <div class="minimap-frame" id="minimapFrame">
      <div class="north" id="northIndicator">N</div>
    </div>

    <div class="bottom">
      <div class="left">
        <div class="rings">
          <div class="ring ring-hp" id="ringHp"><div class="ring-inner"><span>HP</span><div id="hpVal">100</div></div></div>
          <div class="ring ring-armor" id="ringArmor"><div class="ring-inner"><span>AR</span><div id="armorVal">0</div></div></div>
          <div class="ring ring-hunger" id="ringHunger"><div class="ring-inner"><span>FOOD</span><div id="hungerVal">100</div></div></div>
          <div class="ring ring-thirst" id="ringThirst"><div class="ring-inner"><span>WATER</span><div id="thirstVal">100</div></div></div>
        </div>
      </div>
      <div class="center" id="vehicleBlock">
        <!-- reserved if needed for future -->
      </div>
      <div class="right">
        <div class="speedo" id="speedo">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" class="sp-bg" />
            <circle cx="60" cy="60" r="52" class="sp-fg" id="speedArc" />
          </svg>
          <div class="speedo-center">
            <div class="speed-main"><span id="speedNum">0</span><small id="speedUnit">MPH</small></div>
            <div class="speed-gear" id="speedGear">N</div>
          </div>
        </div>
      </div>
    </div>

    <div id="settings" class="settings hidden">
      <div class="settings-card">
        <div class="settings-header">
          <h3>HUD Ayarları</h3>
          <button id="btnClose" class="btn">Kapat</button>
        </div>
        <div class="settings-body">
          <label><input type="checkbox" id="optVisible"> HUD Açık</label>
          <label><input type="checkbox" id="optMetric"> KMH kullan</label>
          <label><input type="checkbox" id="optCompass"> Pusula</label>
          <label><input type="checkbox" id="optStreet"> Sokak/Semt</label>
          <label><input type="checkbox" id="optVoice"> Ses Göstergesi</label>
          <label><input type="checkbox" id="optStress"> Stres</label>
          <label><input type="checkbox" id="optMinimap"> Minimap</label>
          <label><input type="checkbox" id="optClock"> Saat</label>
          <label><input type="checkbox" id="optFuel"> Yakıt</label>
          <label><input type="checkbox" id="optEngine"> Motor</label>
          <label><input type="checkbox" id="optIndicators"> Sinyaller</label>
          <div class="row">
            <label><input type="checkbox" id="optCircle"> Dairesel Minimap</label>
            <label><input type="checkbox" id="optRadarOnFoot"> Yaya iken radar</label>
          </div>
        </div>
        <div class="settings-footer">
          <button id="btnSave" class="btn primary">Kaydet</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
