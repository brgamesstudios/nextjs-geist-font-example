<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root" class="hud hidden">
    <div class="top">
      <div id="compass">N</div>
      <div id="street">Popular St • La Mesa</div>
      <div id="voice" class="voice">
        <div class="dot"></div>
        <span id="voiceLevel">N</span>
      </div>
    </div>

    <div class="minimap-frame" id="minimapFrame">
      <div class="north" id="northIndicator">N</div>
    </div>

    <div class="bottom">
      <div class="left">
        <div class="bar hp"><span id="hpText">100</span></div>
        <div class="bar armor"><span id="armorText">0</span></div>
        <div class="bar stress" id="stressBar"><span id="stressText">0</span></div>
      </div>
      <div class="center" id="vehicleBlock">
        <div class="speed">
          <span id="speed">0</span>
          <small id="speedUnit">MPH</small>
        </div>
        <div class="veh-meta">
          <span id="gear">N</span>
          <span id="rpm">0.0</span>
          <span id="seatbelt" class="chip">BELT</span>
        </div>
      </div>
      <div class="right">
        <!-- reserved for future stats -->
      </div>
    </div>

    <div id="settings" class="settings hidden">
      <div class="settings-card">
        <div class="settings-header">
          <h3>HUD Ayarları</h3>
          <button id="btnClose" class="btn">Kapat</button>
        </div>
        <div class="settings-body">
          <label><input type="checkbox" id="optVisible"> HUD Açık</label>
          <label><input type="checkbox" id="optMetric"> KMH kullan</label>
          <label><input type="checkbox" id="optCompass"> Pusula</label>
          <label><input type="checkbox" id="optStreet"> Sokak/Semt</label>
          <label><input type="checkbox" id="optVoice"> Ses Göstergesi</label>
          <label><input type="checkbox" id="optStress"> Stres</label>
          <label><input type="checkbox" id="optMinimap"> Minimap</label>
          <div class="row">
            <label><input type="checkbox" id="optCircle"> Dairesel Minimap</label>
            <label><input type="checkbox" id="optRadarOnFoot"> Yaya iken radar</label>
          </div>
        </div>
        <div class="settings-footer">
          <button id="btnSave" class="btn primary">Kaydet</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
